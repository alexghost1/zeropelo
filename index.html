<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ZEROPELO — Adiós al pelo de tu mascota en el sofá y la ropa</title>
<meta name="description" content="Rodillo quitapelos reutilizable para perros y gatos. Sin recambios, sin adhesivo, sin pilas. Envío gratis desde España en 3-7 días.">
<meta property="og:title" content="ZEROPELO — Adiós al pelo de tu mascota">
<meta property="og:description" content="Rodillo quitapelos reutilizable. Sin recambios. Envío gratis desde España.">
<meta property="og:image" content="https://alexghost1.github.io/zeropelo/public/images/hero.jpg">
<meta property="og:type" content="product">
<link rel="stylesheet" href="assets/styles.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
</head>
<body>

<!-- ════════════════════════════════════════════════════════════════
     PARA PUBLICAR DE VERDAD: borra el bloque <div class="aviso-borrador">
     que hay justo debajo, y rellena PAGOS en el <script>
/* ═══════════════════════════════════════════════════════════════════
   1. CONFIGURACIÓN DE PAGO
   Pega aquí tus enlaces de pago (Stripe Payment Links o PayPal).
   En cuanto los pegues, los botones llevan al checkout automáticamente.
   ═══════════════════════════════════════════════════════════════════ */
const PAGOS = {
  hero: "",   // ej: "https://buy.stripe.com/xxxxxxxxxxxx"
  kit:  ""    // ej: "https://buy.stripe.com/yyyyyyyyyyyy"
};

/* ═══════════════════════════════════════════════════════════════════
   2. ANALÍTICA Y CAPTURA DE EMAIL (Supabase, proyecto garcia-os)
   La analítica NO guarda IP, ni user agent, ni cookies, ni ningún
   identificador. Por eso no necesita banner de consentimiento.
   La clave de abajo es pública por diseño: solo permite INSERTAR.
   ═══════════════════════════════════════════════════════════════════ */
const SB_URL  = "https://fnaqlnfakpkfcyhvybth.supabase.co";
const SB_KEY  = "sb_publishable_40aJM_WthTYd6_X1YzafZg_0PdirwL6";

function sbInsert(tabla, fila) {
  return fetch(SB_URL + "/rest/v1/" + tabla, {
    method: "POST",
    headers: {
      "apikey": SB_KEY,
      "Authorization": "Bearer " + SB_KEY,
      "Content-Type": "application/json",
      "Prefer": "return=minimal"
    },
    body: JSON.stringify(fila)
  });
}

function registrar(tipo) {
  var ref = "";
  try { ref = document.referrer ? new URL(document.referrer).hostname : "directo"; }
  catch (e) { ref = "directo"; }
  sbInsert("zeropelo_eventos", {
    tipo: tipo,
    ruta: location.pathname.slice(0, 200),
    referente: ref.slice(0, 200)
  }).catch(function () { /* la analítica nunca debe romper la página */ });
}

registrar("visita");

/* ── Botones de compra ───────────────────────────────────────────── */
document.querySelectorAll("[data-pago]").forEach(function (b) {
  b.addEventListener("click", function () {
    registrar(b.dataset.pago === "kit" ? "clic_kit" : "clic_comprar");
    var destino = PAGOS[b.dataset.pago];
    var nota = document.getElementById("pago-nota");
    if (destino) { window.location.href = destino; return; }
    nota.textContent = "Pasarela de pago todavía no conectada. Añade tus enlaces en la constante PAGOS de index.html.";
    nota.style.color = "#b23c2c";
    nota.scrollIntoView({ behavior: "smooth", block: "center" });
  });
});

/* ── Alta de email ───────────────────────────────────────────────── */
var form = document.getElementById("form-email");
form.addEventListener("submit", function (e) {
  e.preventDefault();
  var email   = document.getElementById("email").value.trim();
  var consent = document.getElementById("consent").checked;
  var msg     = document.getElementById("form-msg");
  var boton   = form.querySelector("button");

  msg.className = "form-msg";
  if (!/^[^@\s]+@[^@\s]+\.[^@\s]{2,}$/.test(email)) {
    msg.textContent = "Revisa el correo, parece que falta algo.";
    msg.classList.add("err"); return;
  }
  if (!consent) {
    msg.textContent = "Necesitamos que marques la casilla para poder escribirte.";
    msg.classList.add("err"); return;
  }

  boton.disabled = true;
  boton.textContent = "Enviando…";

  sbInsert("zeropelo_leads", { email: email, consentimiento: true, origen: "tienda" })
    .then(function (r) {
      if (r.ok) {
        registrar("alta_email");
        form.innerHTML = '<p class="form-msg ok" style="font-size:1.05rem">' +
          'Apuntado. Te escribimos en cuanto abramos pedidos.</p>';
      } else if (r.status === 409) {
        msg.textContent = "Ese correo ya estaba apuntado. No hace falta nada más.";
        msg.classList.add("ok");
        boton.disabled = false; boton.textContent = "Avísame";
      } else {
        throw new Error("HTTP " + r.status);
      }
    })
    .catch(function () {
      msg.textContent = "No hemos podido guardarlo. Inténtalo dentro de un momento.";
      msg.classList.add("err");
      boton.disabled = false; boton.textContent = "Avísame";
    });
});
</script>
</body>
</html>
