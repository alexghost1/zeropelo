<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 520" role="img"
     aria-labelledby="t-desp d-desp">
  <title id="t-desp">Despiece animado del rodillo ZEROPELO</title>
  <desc id="d-desp">Las tres piezas del rodillo se separan y vuelven a montarse: mango, tambor y cuna.</desc>

  <defs>
    <linearGradient id="crema2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FEFDFA"/><stop offset="1" stop-color="#EFE9DE"/>
    </linearGradient>
    <linearGradient id="tealG2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#12766D"/><stop offset="1" stop-color="#0B534D"/>
    </linearGradient>
    <style>
      .pieza { transform-box: fill-box; transform-origin: center; }
      .mango  { animation: sepMango  6s ease-in-out infinite; }
      .tambor { animation: sepTambor 6s ease-in-out infinite; }
      .cuna   { animation: sepCuna   6s ease-in-out infinite; }
      .guia   { animation: guiaFade  6s ease-in-out infinite; }
      @keyframes sepMango  { 0%,12%{transform:translate(0,0)} 42%,58%{transform:translate(46px,-52px)} 88%,100%{transform:translate(0,0)} }
      @keyframes sepTambor { 0%,12%{transform:translate(0,0)} 42%,58%{transform:translate(0,-14px)}   88%,100%{transform:translate(0,0)} }
      @keyframes sepCuna   { 0%,12%{transform:translate(0,0)} 42%,58%{transform:translate(-40px,46px)} 88%,100%{transform:translate(0,0)} }
      @keyframes guiaFade  { 0%,18%{opacity:0} 42%,58%{opacity:0.5} 82%,100%{opacity:0} }
    </style>
  </defs>

  <rect width="520" height="520" fill="#F5EFE3"/>

  <!-- eje de montaje, solo visible cuando las piezas estan separadas -->
  <g class="guia">
    <path d="M96 372 L440 156" stroke="#B3A992" stroke-width="1.5" stroke-dasharray="6 7"/>
  </g>

  <!-- cuna teal -->
  <g class="pieza cuna">
    <path d="M108 250 a26 26 0 0 1 26-26 h178 a56 56 0 0 1 0 112 h-178 a26 26 0 0 1 -26-26 Z"
          fill="url(#tealG2)" stroke="#08403B" stroke-width="2.5"/>
    <rect x="226" y="344" width="30" height="8" rx="4" fill="#0A4A44"/>
  </g>

  <!-- tambor crema con cerdas -->
  <g class="pieza tambor">
    <rect x="132" y="228" width="204" height="104" rx="52" fill="url(#crema2)" stroke="#C9BFAC" stroke-width="2.5"/>
    <g stroke="#6E6656" stroke-width="1.6" stroke-linecap="round" opacity="0.75">
      <path d="M156 232 v-9 M168 231 v-9 M180 230 v-9 M192 230 v-9 M204 230 v-9 M216 230 v-9 M228 230 v-9 M240 230 v-9 M252 230 v-9 M264 230 v-9 M276 231 v-9 M288 232 v-9"/>
      <path d="M156 328 v9 M168 329 v9 M180 330 v9 M192 330 v9 M204 330 v9 M216 330 v9 M228 330 v9 M240 330 v9 M252 330 v9 M264 330 v9 M276 329 v9 M288 328 v9"/>
    </g>
    <ellipse cx="316" cy="280" rx="20" ry="52" fill="#E7E0D2" stroke="#C9BFAC" stroke-width="2.5"/>
  </g>

  <!-- mango crema -->
  <g class="pieza mango">
    <path d="M300 262 L396 156 a27 27 0 0 1 41 36 L341 298 Z" fill="url(#crema2)" stroke="#C9BFAC" stroke-width="2.5"/>
    <ellipse cx="378" cy="204" rx="9" ry="13" fill="#E4DCCB" transform="rotate(-42 378 204)"/>
  </g>
</svg>
